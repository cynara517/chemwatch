name: Observe sources and publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: chemwatch-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate and test
        run: python -m unittest discover -s tests -v
      - name: Observe sources (partial failures stay visible)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python scripts/refresh.py
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
      - name: Rebuild downloadable toolkit from current source and observations
        run: python scripts/package.py
      - name: Save real observation history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add dist/data dist/downloads dist/install.sh skills/chemwatch-monitor/scripts
          git diff --cached --quiet || git commit -m 'Refresh source observations'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
